<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">

    <g transform="rotate(-18 32 32)">

        <!-- Pencil Tip -->
        <polygon
                points="6,32 12,28 12,36"
                fill="#2F2F2F"/>

        <!-- Wood -->
        <polygon
                points="12,28 20,26 20,38 12,36"
                fill="#D8B18A"/>

        <!-- Pencil Body -->
        <rect
                x="20"
                y="27"
                width="34"
                height="11"
                fill="#A65C34"/>

        <!-- Highlight -->
        <rect
                x="20"
                y="26"
                width="28"
                height="4"
                fill="#D98A53" />
        <rect
                x="20"
                y="34"
                width="28"
                height="4"
                fill="#D98A53" />

        <!-- Ferrule -->
        <rect
                x="48"
                y="26"
                width="5"
                height="12"
                fill="#C6C6C6"/>

        <line
                x1="50"
                y1="26"
                x2="50"
                y2="38"
                stroke="#A5A5A5"
                stroke-width="0.8"/>

        <line
                x1="52"
                y1="26"
                x2="52"
                y2="38"
                stroke="#A5A5A5"
                stroke-width="0.8"/>

        <!-- Eraser -->
        <rect
                x="53"
                y="26"
                width="7"
                height="12"
                rx="2"
                fill="#A65C34"/>

    </g>

</svg>